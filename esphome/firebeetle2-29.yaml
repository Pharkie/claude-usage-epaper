# Claude Code usage on a 2.9" e-paper display (ESPHome + Home Assistant)
# Shows the week as a chart: usage so far against an even-pace line, where it
# runs out at the last 24 h's rate, and how much a day is left, on a
# FireBeetle 2 ESP32-C6 + Waveshare 2.90" V2 (B/W) panel. (It showed Session,
# Week and Fable bars until Anthropic dropped the five-hour limit for Ultra
# accounts on 2026-10-30; the week is the only limit left.) Fable, which has
# its own weekly limit inside the week's, is the solid part of the chart's
# area, with "Fable 4%" under the reset time (since 2026-11-18).
# Setup instructions: see README.md in the repo.
#
# Mains-powered: no deep sleep. Redraws ONLY when displayed data changes
# (checked every 60s), plus an occasional safety refresh, so the full-refresh
# flash happens when a % ticks, not every 5 minutes.
# Data comes from Home Assistant REST sensors polling
# https://api.anthropic.com/api/oauth/usage, and the chart's history, pace and
# run-out from homeassistant/week_chart.yaml (see README.md).
#
# Author: Adam Knowles

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

substitutions:
  device_name: "firebeetle2-29"
  friendly_name: "Firebeetle2 29"
  # readiness_checks gates the FIRST draw on everything the dashboard shows, so
  # a partial frame (bars missing) never appears. Timeout still draws whatever
  # has arrived; the 60s change-check repaints as the rest lands. No wifisignal
  # here, its first reading lags 30s and would stall boot.
  # NB: this block scalar is injected verbatim into C++, comments must stay
  # OUT of it (a '#' line inside becomes an invalid preprocessor directive).
  readiness_checks: |-
    {"WiFi", id(wifi_status).is_connected()},
    {"HA API", id(api_status).is_connected()},
    {"Time", id(homeassistant_time).now().is_valid()},
    {"Week usage", id(week_pct).has_state() &&
                   !isnan(id(week_pct).state)},
    {"Week chart", id(chart_points).has_state() &&
                   id(chart_hour).has_state()},

# Inlined basics (were a shared include in the original project)
safe_mode:
  boot_is_good_after: 3s
  num_attempts: 5
  reboot_timeout: 1min

mdns:

web_server:
  port: 80

logger:
  # Keep at INFO: DEBUG level triggers a compile error with the Waveshare ePaper component.
  level: INFO
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  id: wifi_status
  # Mains-powered display: no scanning delay, no radio power-save latency.
  fast_connect: true
  power_save_mode: none

# Reuse your existing API encryption key and OTA password if the device is already
# adopted in HA, so it reconnects and accepts OTA without re-provisioning.
api:
  encryption:
    key: !secret api_encryption_key   # generate: openssl rand -base64 32
  id: api_status

ota:
  - platform: esphome
    password: !secret ota_password     # any hex string; keep it private

button:
  - platform: shutdown
    name: "Shutdown Device"
  - platform: restart
    name: "Restart Device"
  - platform: template
    name: "Refresh Screen"
    entity_category: config
    on_press:
      - script.execute: update_screen

external_components:
  - source:
      type: git
      url: https://github.com/lboue/esphome
      ref: adc_oneshot
    components: [adc]
    refresh: 0s # Do not update automatically

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  includes:
    - includes/text_utils.h # Include the text utilities
    - includes/status_banner.h # Full-screen status banner (distinct per fault)
    - includes/week_chart.h # The week chart itself

  # Boot: wait (max 20s) until everything the dashboard needs has arrived,
  # then draw ONCE. No intermediate status draw, saves a full 3-4s refresh.
  on_boot:
    priority: -100.0
    then:
      - output.turn_on: internal_led
      - wait_until:
          condition:
            lambda: |-
              bool all_ready = true;
              struct {
                const char* name;
                bool ready;
              } checks[] = { ${readiness_checks} };
              for (auto& check : checks) {
                if (!check.ready) {
                  all_ready = false;
                  break;
                }
              }
              return all_ready;
          timeout: 20s
      - lambda: |-
          // Record anything still missing for the (rare) nothing-arrived screen.
          struct {
            const char* name;
            bool ready;
          } checks[] = { ${readiness_checks} };
          std::string missing_data;
          bool first_missing = true;
          for (auto& check : checks) {
            if (!check.ready) {
              if (!first_missing) { missing_data += ", "; }
              missing_data += check.name;
              first_missing = false;
            }
          }
          if (!missing_data.empty()) {
            ESP_LOGW("boot", "Proceeding without: %s", missing_data.c_str());
            id(boot_status_line2) = "Missing: " + missing_data;
          }
      - script.execute: update_boot_time
      - script.execute: update_screen
      # Record the signature of what we just drew, so the first 60s check does
      # not redundantly redraw identical content.
      - script.execute: compute_sig
      - lambda: 'id(drawn_sig) = id(pending_sig);'
      - output.turn_off: internal_led

binary_sensor:
  - platform: status
    name: "Status"

globals:
  - id: recorded_display_refresh
    type: int
    restore_value: yes
    initial_value: "0"
  - id: boot_status_line2
    type: std::string
    restore_value: no
    initial_value: '"Waiting for WiFi/HA..."'
  # drawn_sig = signature of what's on screen now; pending_sig = signature just
  # computed by compute_sig. Redraw happens only when they differ.
  - id: drawn_sig
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: pending_sig
    type: std::string
    restore_value: no
    initial_value: '""'

script:
  # Compute the "what should be on screen" signature into pending_sig. Shared by
  # on_boot (to record the first draw) and the 60s interval (to detect changes).
  - id: compute_sig
    then:
      - lambda: |-
          // NB: bare id(x) yields a raw pointer in ESPHome lambdas, so the
          // helper must take a pointer (HomeassistantSensor* upcasts fine).
          auto num_of = [](esphome::sensor::Sensor *s) -> std::string {
            return (s->has_state() && !isnan(s->state))
                       ? std::to_string((int) lroundf(s->state)) : std::string("-");
          };
          // Everything the chart draws. The hour moves "now" along the chart,
          // so this changes at most hourly plus whenever usage ticks; the
          // points hash catches a history rewrite with no other change.
          id(pending_sig) =
              num_of(id(week_pct)) + "|" + num_of(id(chart_hour)) + "|" +
              num_of(id(chart_run_out)) + "|" + num_of(id(chart_proj_end)) + "|" +
              id(chart_strip).state + "|" + id(chart_alarm).state + "|" +
              id(chart_out_label).state + "|" + id(chart_time_left).state + "|" +
              id(chart_reset).state + "|" + id(chart_days).state + "|" +
              std::to_string((unsigned) std::hash<std::string>{}(id(chart_points).state)) + "|" +
              num_of(id(fable_pct)) + "|" + num_of(id(chart_fable_cap)) + "|" +
              std::to_string((unsigned) std::hash<std::string>{}(id(chart_fable_points).state)) + "|" +
              id(usage_status).state + "|" +
              (id(api_status).is_connected() ? "1" : "0");
  - id: update_screen
    mode: restart
    then:
      - component.update: adam_epaper1
      - lambda: |-
          id(recorded_display_refresh) += 1;
          id(display_refreshes).publish_state(id(recorded_display_refresh));
          if (id(homeassistant_time).now().is_valid()) {
            id(display_last_update).publish_state(
                id(homeassistant_time).now().timestamp);
          }
  - id: update_boot_time
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(homeassistant_time).now().is_valid();'
          then:
            - lambda: |-
                auto boot_time = id(homeassistant_time).now().timestamp -
                                  (int) id(uptime_seconds).state;
                id(last_boot_time).publish_state(boot_time);

interval:
  # Redraw only when displayed content changed (values, reset times, status,
  # HA link). Checked every 60s => worst-case 60s lag, zero needless flash.
  - interval: 60s
    then:
      - script.execute: compute_sig
      - lambda: |-
          if (id(pending_sig) != id(drawn_sig)) {
            ESP_LOGI("display", "Content changed, redrawing (%s)", id(pending_sig).c_str());
            id(drawn_sig) = id(pending_sig);
            id(update_screen).execute();
          }
  # Occasional anti-ghost refresh only (full_update_every:1 already clears
  # ghosting on each redraw).
  - interval: 6h
    then:
      - script.execute: update_screen

time:
  - platform: homeassistant
    id: homeassistant_time
    # No timezone: set, ESPHome syncs the timezone from Home Assistant at
    # runtime, so the device follows HA's TZ automatically.

sensor:
  # ---- Claude usage percentages, imported from Home Assistant ----
  # internal: false so the device re-exports them: what the ESP *thinks* the
  # values are is then visible in HA, invaluable for debugging.
  - platform: homeassistant
    name: "Claude Week"
    entity_id: sensor.claude_usage_week
    id: week_pct
    internal: false

  # Fable against its own weekly limit. Not a readiness check: the panel
  # draws without it, and an unavailable Fable only hides the slice.
  - platform: homeassistant
    name: "Claude Fable"
    entity_id: sensor.claude_usage_fable
    id: fable_pct
    internal: false

  # ---- The week chart, worked out by homeassistant/week_chart.yaml ----
  # Attributes of sensor.claude_usage_week_chart; internal (the default for
  # this platform) because they only matter to the drawing.
  - platform: homeassistant
    entity_id: sensor.claude_usage_week_chart
    attribute: hour
    id: chart_hour

  - platform: homeassistant
    entity_id: sensor.claude_usage_week_chart
    attribute: run_out
    id: chart_run_out

  - platform: homeassistant
    entity_id: sensor.claude_usage_week_chart
    attribute: proj_end
    id: chart_proj_end

  - platform: homeassistant
    entity_id: sensor.claude_usage_week_chart
    attribute: fable_cap
    id: chart_fable_cap

  # ---- Battery (kept in case the LiPo is left connected) ----
  - platform: adc
    name: "Battery Voltage"
    id: batt_voltage
    pin: 0
    accuracy_decimals: 2
    update_interval: 300s
    samples: 5
    filters:
      - multiply: 2.0
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1

  - platform: template
    name: "Battery"
    id: batt_percentage
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 15min
    device_class: battery
    lambda: |-
      float min_voltage = 2.96;
      float max_voltage = 4.18;
      float current_voltage = id(batt_voltage).state;
      if (isnan(current_voltage)) { return NAN; }
      float battery_percentage = 100 *
        ((current_voltage - min_voltage) / (max_voltage - min_voltage));
      if (battery_percentage > 100) { battery_percentage = 100; }
      else if (battery_percentage < 0) { battery_percentage = 0; }
      return battery_percentage;

  # ---- Diagnostics ----
  - platform: template
    name: "Display Last Update"
    id: display_last_update
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: template
    name: "Display Refreshes"
    id: display_refreshes
    accuracy_decimals: 0
    unit_of_measurement: "Refreshes"
    state_class: "total_increasing"
    entity_category: diagnostic
    lambda: 'return id(recorded_display_refresh);'

  - platform: wifi_signal
    name: "WiFi Signal Strength"
    id: wifisignal
    unit_of_measurement: "dBm"
    entity_category: "diagnostic"
    update_interval: 60s

  - platform: uptime
    id: uptime_seconds
    name: "Uptime Seconds"
    internal: true

  - platform: template
    name: "Last Boot"
    id: last_boot_time
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  # Auth health from HA: "ok" / "auth_failed" / "unknown". Drives the
  # full-screen TOKEN EXPIRED banner.
  - platform: homeassistant
    name: "Usage Status"
    entity_id: sensor.claude_usage_status
    id: usage_status
    internal: false

  # The strip under the chart ("19% ahead of pace · 9%/day left"), exported
  # so what the panel is showing can be read in HA.
  - platform: homeassistant
    name: "Week Chart Strip"
    entity_id: sensor.claude_usage_week_chart
    id: chart_strip
    internal: false

  # The week's hourly history. Internal and must stay so: it runs past HA's
  # 255-character state limit late in the week.
  - platform: homeassistant
    entity_id: sensor.claude_usage_week_chart
    attribute: points
    id: chart_points

  # Fable's hourly history: as points, and internal for the same reason.
  - platform: homeassistant
    entity_id: sensor.claude_usage_week_chart
    attribute: fable_points
    id: chart_fable_points

  - platform: homeassistant
    entity_id: sensor.claude_usage_week_chart
    attribute: alarm
    id: chart_alarm

  - platform: homeassistant
    entity_id: sensor.claude_usage_week_chart
    attribute: run_out_label
    id: chart_out_label

  - platform: homeassistant
    entity_id: sensor.claude_usage_week_chart
    attribute: time_left
    id: chart_time_left

  - platform: homeassistant
    entity_id: sensor.claude_usage_week_chart
    attribute: reset_label
    id: chart_reset

  - platform: homeassistant
    entity_id: sensor.claude_usage_week_chart
    attribute: days
    id: chart_days

output:
  - platform: gpio
    pin: 15
    id: internal_led

font:
  - file:
      type: gfonts
      family: Montserrat
      weight: 700
    size: 15
    id: font_row

  - file:
      type: gfonts
      family: Montserrat
      weight: 400
    size: 10
    id: font_tiny

  - file:
      type: gfonts
      family: Montserrat
      weight: 700
    size: 22
    id: font_h2

  # The chart's fonts. The big % carries only the glyphs it can show; the
  # strip needs the middle dot, which is not in the default glyph set.
  - file:
      type: gfonts
      family: Montserrat
      weight: 700
    size: 30
    id: font_big
    glyphs: ["0123456789%-"]

  - file:
      type: gfonts
      family: Montserrat
      weight: 700
    size: 10
    id: font_tiny_b

  - file:
      type: gfonts
      family: Montserrat
      weight: 700
    size: 11
    id: font_strip
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["·"]

# ePaper colour convention: on this display white means no ink (000000) and
# black means ink (FFFFFF). See https://github.com/esphome/issues/issues/3132
color:
  - id: colour_white
    hex: "000000"
  - id: colour_black
    hex: "FFFFFF"

spi:
  clk_pin: 4
  mosi_pin: 6 # DIN

display:
  - platform: waveshare_epaper
    model: 2.90inV2
    cs_pin: 7
    dc_pin: 1
    busy_pin: 3
    reset_pin: 2
    reset_duration: 2ms
    rotation: 270
    # Full refresh every update. This panel
    # does NOT do partial refresh cleanly, higher values superimpose frames
    # and corrupt the image. Keep at 1. Redraw frequency is already minimised
    # by the change-detection interval above.
    full_update_every: 1
    update_interval: never
    id: adam_epaper1
    lambda: |-
      ESP_LOGI("display", ">>> DISPLAY UPDATE <<<");

      // Landscape 296 x 128 after rotation.
      const int W = it.get_width();
      const int H = it.get_height();

      const bool have_any = id(week_pct).has_state() && !isnan(id(week_pct).state);

      // Faults, most specific first. Each condition gets its OWN wording:
      // only `auth_failed` means the token is genuinely dead, so only that one
      // tells the user to re-mint. `no_token` (HA hasn't handed us a bearer
      // yet) is normal for a few minutes after a Core restart, and used to be
      // reported as "TOKEN EXPIRED" -- sending the user after a problem that
      // did not exist.
      const std::string st = id(usage_status).state;
      const bool ha_link   = id(api_status).is_connected();

      const char *head = nullptr, *detail = "", *advice = "";
      if (st == "auth_failed") {
        head   = "TOKEN EXPIRED";
        detail = "Claude rejected the usage token";
        advice = "Renew: re-run mint_claude_token.py (see repo)";
      } else if (!have_any) {
        if (!ha_link) {
          head   = "NO HOME ASSISTANT";
          detail = "Can't reach Home Assistant";
          advice = "Check HA is up and this display's wifi";
        } else if (st == "no_token") {
          head   = "TOKEN NOT READY";
          detail = "Home Assistant has no token yet";
          advice = "Normal for a few min after an HA restart";
        } else if (st == "rate_limited") {
          head   = "RATE LIMITED";
          detail = "Claude API is rate limiting";
          advice = "Should clear on its own";
        } else if (st == "unknown") {
          head   = "NO USAGE DATA";
          detail = "HA could not read the Claude API";
          advice = "Token looks fine; check HA's internet";
        }
      }

      if (head != nullptr) {
        DrawStatusBanner(&it, id(font_h2), id(font_row), id(font_tiny),
                         id(colour_black), id(colour_white),
                         head, detail, advice, id(homeassistant_time).now());
        return;
      }

      // Nothing yet and no specific fault to name: boot/status screen.
      if (!have_any) {
        it.printf(W / 2, H / 2 - 16, id(font_h2), id(colour_black),
                  TextAlign::CENTER, "Waiting for data...");
        it.printf(W / 2, H / 2 + 16, id(font_tiny), id(colour_black),
                  TextAlign::CENTER, "%s", id(boot_status_line2).c_str());
        return;
      }

      week_chart::Data d;
      d.used = (int) lroundf(id(week_pct).state);
      d.points = id(chart_points).state;
      d.hour = (id(chart_hour).has_state() && !isnan(id(chart_hour).state))
                   ? (int) id(chart_hour).state : -1;
      d.run_out = (id(chart_run_out).has_state() && !isnan(id(chart_run_out).state))
                      ? id(chart_run_out).state : -1;
      d.run_out_label = id(chart_out_label).state;
      d.proj_end = (id(chart_proj_end).has_state() && !isnan(id(chart_proj_end).state))
                       ? (int) id(chart_proj_end).state : -1;
      d.time_left = id(chart_time_left).state;
      d.reset_label = id(chart_reset).state;
      d.days = id(chart_days).state;
      d.fable = (id(fable_pct).has_state() && !isnan(id(fable_pct).state))
                    ? (int) lroundf(id(fable_pct).state) : -1;
      d.fable_points = id(chart_fable_points).state;
      d.fable_cap = (id(chart_fable_cap).has_state() && !isnan(id(chart_fable_cap).state))
                        ? (int) id(chart_fable_cap).state : -1;

      // The strip says what HA worked out, unless the data behind the chart
      // is stale: then it says so, inverted, and the chart is the last good one.
      if (!ha_link) {
        d.strip = "HA offline · chart may be stale";
        d.invert_strip = true;
      } else if (st == "rate_limited") {
        d.strip = "API rate limited · chart may be stale";
        d.invert_strip = true;
      } else if (st == "no_token") {
        d.strip = "Token not ready · chart may be stale";
        d.invert_strip = true;
      } else if (st == "unknown") {
        d.strip = "No API data · chart may be stale";
        d.invert_strip = true;
      } else {
        d.strip = id(chart_strip).state;
        d.invert_strip = id(chart_alarm).state == "on";
      }

      week_chart::Fonts f{id(font_big), id(font_row), id(font_tiny),
                          id(font_tiny_b), id(font_strip)};
      week_chart::Draw(&it, f, id(colour_black), id(colour_white), d);
