# The token-expiry sensor. Add under `command_line:` in configuration.yaml,
# alongside token_expiry.py at /config/claude_usage/. `command_line` is
# hot-reloadable once the domain exists (Developer Tools > YAML > Command Line
# entities); adding the domain for the first time needs a Core restart.
command_line:
  # ==========================================================================
  # CLAUDE USAGE TOKEN EXPIRY -- the re-mint deadline, and the rotation alarm.
  #
  # This house runs the STATIC 1-YEAR token (design B, adopted 2026-08-22), so
  # the clock that matters is the access token's own: obtained_at + expires_in.
  # mint_claude_token.py requests expires_in=31536000 and Anthropic grants it
  # with scope user:profile, which is all the usage endpoint needs.
  #
  # The refresh CHAIN is reported as an attribute but deliberately NOT used. A
  # refresh REVOKES the current access token and returns an 8h one, so touching
  # the chain is precisely what downgrades a 1-year token. The chain lapses 30
  # days after the mint and that is fine.
  #
  # `looks_rotated` is the tripwire: expires_in < 1 day means something DID
  # refresh -- check that claude_usage_token_renew is still commented out in
  # automations.yaml. Left enabled it quietly costs you eleven months.
  # ==========================================================================
  - sensor:
      name: "Claude Usage Token Days Left"
      unique_id: claude_usage_token_days_left
      command: "python3 /config/claude_usage/token_expiry.py"
      # Reads credentials.json only; no network, so it cannot be fooled by the
      # 429s Anthropic's bot defence returns to the usage endpoint.
      scan_interval: 3600
      unit_of_measurement: "d"
      icon: mdi:key-chain
      # This sensor has a unit, so it may NOT hold a non-numeric state. Same trap
      # the % sensors fell into -- express "no data" with availability.
      availability: "{{ value_json is defined and value_json.days_left is number }}"
      value_template: "{{ value_json.days_left }}"
      json_attributes:
        - expires_at
        - minted_at
        - expires_in
        - looks_rotated
        - chain_days_left
        - chain_expires_at
