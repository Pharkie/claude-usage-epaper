
# ---------------------------------------------------------------------------
# Claude Code usage (Session / Weekly all-models / Weekly Fable).
# Polls the undocumented OAuth usage endpoint that powers Claude Code's /usage.
# Auth: the Authorization header is a TEMPLATE reading input_text.claude_oauth_bearer
# (create that helper, value "Bearer <token>" from mint_claude_token.py). HA re-renders
# the header every poll, so the renewal automation can swap the token live by writing
# the helper - the REST integration is NEVER reloaded. (Repeated rest.reload, the old
# way of picking up a rotated token, wedges the integration: entities freeze and it
# stops polling. Templated header avoids that entirely.)
# NB: keep the claude-cli User-Agent below: fake-looking UAs get a permanent-seeming
# 429 "rate_limit_error" from Anthropic bot defence.
# July 2026 JSON: session = five_hour.utilization, weekly-all = seven_day.utilization,
# per-model in `limits[]` where kind == "weekly_scoped" (scope.model.display_name).
# Templates only emit numbers when the source is a number, never 0 (0% would be
# a lie). A "%" sensor may NOT hold a non-numeric state -- HA raises ValueError
# ("indicating it has a numeric value; however ...") and the entity dies as
# `unavailable`, so the no-data case is expressed with `availability:`, not with
# a placeholder string. ("unknown" and "None" are equally invalid there.)
#
# claude_usage_status is deliberately granular, because these need different
# reactions and only ONE of them wants the user to re-mint:
#   ok           - got usage data: five_hour, seven_day OR limits[]. Not
#                  five_hour alone: Anthropic dropped the five-hour session
#                  limit for verified Ultra (ex-Max 20x) accounts on
#                  2026-10-30, and from then on the endpoint answers 200 with
#                  `five_hour: null` and no `session` entry in limits[]. The
#                  old test required five_hour, so a perfectly good response
#                  read as `unknown` for weeks and the stale alert blamed the
#                  token. Session then shows "--" and its reset line says
#                  "No limit"; Week and Fable carry on.
#   no_token     - input_text.claude_oauth_bearer isn't populated. Normal for a
#                  few minutes after a Core restart: the REST poll can fire
#                  before the helper restores, sending an empty Authorization
#                  header. Previously reported as auth_failed, which put a
#                  false "TOKEN EXPIRED / re-mint" banner on the display.
#   auth_failed  - a real token WAS sent and Anthropic rejected it. The only
#                  state that means re-mint.
#   rate_limited - 429 from Anthropic. NOTE an EXPIRED token often lands here,
#                  not in auth_failed: Anthropic answers a dead token with 429
#                  rate_limit_error as often as 401. Anything alerting on a bad
#                  token must watch both (learned 2026-08-22, the hard way).
#   unknown      - reachable-but-unusable response (transport problem).
#
# The `availability:` templates must guard the KEY, not just value_json. On an
# error response value_json IS defined -- it is {"type":"error","error":{...}} --
# so a bare `value_json.five_hour` is Undefined and its truthiness RAISES. HA
# then treats the errored availability template as available, renders the value
# template, and pushes a non-numeric state at a sensor carrying unit "%", which
# is the ValueError that kills the entity. Hence `value_json.five_hour is
# defined and ...`, mirroring the status template's short-circuiting idiom.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Claude Code usage (Session / Weekly all-models / Weekly Fable).
# Polls the undocumented OAuth usage endpoint that powers Claude Code's /usage.
# Auth: OAuth access token WITH user:profile scope, in secrets.yaml as
# claude_oauth_bearer (includes the leading "Bearer ").
# July 2026 JSON: session = five_hour.utilization, weekly-all = seven_day.utilization,
# per-model in `limits[]` where kind == "weekly_scoped" (scope.model.display_name).
# Templates only emit numbers when the source is a number — anything else yields
# "unknown" (NOT 0). claude_usage_status distinguishes a dead/rejected token
# ("auth_failed") from transport problems ("unknown") so the display can show
# an explicit TOKEN EXPIRED banner.
# ---------------------------------------------------------------------------
rest:
  - resource: "https://api.anthropic.com/api/oauth/usage"
    scan_interval: 300
    timeout: 30
    headers:
      Authorization: "{{ states('input_text.claude_oauth_bearer') }}"
      anthropic-beta: "oauth-2025-04-20"
      User-Agent: "claude-cli/2.1.209 (external, cli)"
      Content-Type: "application/json"
    sensor:
      - name: "Claude Usage Status"
        unique_id: claude_usage_status
        icon: mdi:key-alert
        value_template: >
          {% set bearer = states('input_text.claude_oauth_bearer') %}
          {% if not bearer.startswith('Bearer ') %}no_token
          {%- elif value_json is defined and ((value_json.five_hour is defined and value_json.five_hour)
                or (value_json.seven_day is defined and value_json.seven_day)
                or (value_json.limits is defined and value_json.limits)) %}ok
          {%- elif value_json is defined and value_json.error is defined and value_json.error.type is defined %}
          {{- ' rate_limited' if value_json.error.type == 'rate_limit_error' else ' auth_failed' }}
          {%- else %}unknown{% endif %}

      - name: "Claude Usage Session"
        unique_id: claude_usage_session
        unit_of_measurement: "%"
        icon: mdi:clock-fast
        availability: >
          {{ value_json is defined and value_json.five_hour is defined
             and value_json.five_hour and value_json.five_hour.utilization is number }}
        value_template: >
          {{ value_json.five_hour.utilization | round(0) }}
        json_attributes_path: "$.five_hour"
        json_attributes:
          - resets_at

      - name: "Claude Usage Week"
        unique_id: claude_usage_week
        unit_of_measurement: "%"
        icon: mdi:calendar-week
        availability: >
          {{ value_json is defined and value_json.seven_day is defined
             and value_json.seven_day and value_json.seven_day.utilization is number }}
        value_template: >
          {{ value_json.seven_day.utilization | round(0) }}
        json_attributes_path: "$.seven_day"
        json_attributes:
          - resets_at

      - name: "Claude Usage Fable"
        unique_id: claude_usage_fable
        unit_of_measurement: "%"
        icon: mdi:star-four-points
        # The scoped weekly limit; prefer model "Fable", else first weekly_scoped.
        availability: >
          {% set ls = (value_json.limits | selectattr('kind', 'eq', 'weekly_scoped') | list)
                      if value_json is defined and value_json.limits is defined else [] %}
          {% set fable = ls | selectattr('scope.model.display_name', 'eq', 'Fable') | list %}
          {{ (fable and fable[0].percent is number) or (ls and ls[0].percent is number) }}
        value_template: >
          {% set ls = (value_json.limits | selectattr('kind', 'eq', 'weekly_scoped') | list)
                      if value_json is defined and value_json.limits is defined else [] %}
          {% set fable = ls | selectattr('scope.model.display_name', 'eq', 'Fable') | list %}
          {% if fable and fable[0].percent is number %}{{ fable[0].percent | round(0) }}
          {%- else %}{{ ls[0].percent | round(0) }}{% endif %}

      # ---- Formatted reset times (local TZ) for the e-paper display ----
      - name: "Claude Usage Session Reset"
        unique_id: claude_usage_session_reset
        icon: mdi:clock-end
        value_template: >
          {% if value_json is defined and value_json.five_hour is defined
                and value_json.five_hour and value_json.five_hour.resets_at %}
          Resets {{ as_timestamp(value_json.five_hour.resets_at) | timestamp_custom('%H:%M') }}
          {%- elif value_json is defined and value_json.five_hour is defined and value_json.five_hour is none
                and value_json.seven_day is defined and value_json.seven_day %}No limit
          {%- else %}unknown{% endif %}

      - name: "Claude Usage Week Reset"
        unique_id: claude_usage_week_reset
        icon: mdi:clock-end
        value_template: >
          {% if value_json is defined and value_json.seven_day and value_json.seven_day.resets_at %}
          Resets {{ as_timestamp(value_json.seven_day.resets_at) | timestamp_custom('%a %H:%M') }}
          {%- else %}unknown{% endif %}

      - name: "Claude Usage Fable Reset"
        unique_id: claude_usage_fable_reset
        icon: mdi:clock-end
        value_template: >
          {% set ls = (value_json.limits | selectattr('kind', 'eq', 'weekly_scoped') | list)
                      if value_json is defined and value_json.limits is defined else [] %}
          {% set fable = ls | selectattr('scope.model.display_name', 'eq', 'Fable') | list %}
          {% if fable and fable[0].resets_at %}
          Resets {{ as_timestamp(fable[0].resets_at) | timestamp_custom('%a %H:%M') }}
          {%- elif ls and ls[0].resets_at %}
          Resets {{ as_timestamp(ls[0].resets_at) | timestamp_custom('%a %H:%M') }}
          {%- else %}unknown{% endif %}
