# NOTE: this is the published copy. The live automations on the author's HA
# instance name a private wrapper script at those two "Re-mint:" lines; here they
# name the mint script in this repo instead. That divergence is deliberate -- do
# not "fix" it back when syncing from a running system.
- id: claude_usage_auth_failed_alert
  alias: "Claude Usage - usage data stale alert"
  description: >-
    Backstop: notify if the panel has had no usage data for 45 min, WHATEVER the
    reason. It used to watch auth_failed alone, and on 2026-08-22 that missed a
    real dead token for seven hours: an expired token gets 429 rate_limit_error
    from Anthropic, not 401, so the status sensor sat on rate_limited (flapping
    to auth_failed and back) and this automation never fired. Zero notifications
    were raised and the wall panel was how anyone found out. Watch every failure
    state instead. no_token is deliberately excluded -- it is normal for a few
    minutes after a Core restart and claude_usage_refresh_after_start handles it.
    This is now the ONLY self-heal signal: the house runs the static 1-year token
    and nothing retries automatically.
  triggers:
    - trigger: state
      entity_id: sensor.claude_usage_status
      to:
        - "auth_failed"
        - "rate_limited"
        - "unknown"
      for: "00:45:00"
  actions:
    - action: persistent_notification.create
      data:
        notification_id: claude_usage_token_dead
        title: "Claude usage panel has no data ({{ states('sensor.claude_usage_status') }})"
        message: >-
          sensor.claude_usage_status has been "{{ states('sensor.claude_usage_status') }}"
          for 45 min, so the 2.9" panel is showing a fault instead of usage.
          {% set d = states('sensor.claude_usage_token_days_left') %}
          {% if d not in ['unknown', 'unavailable'] and d | float(999) < 1 -%}
          The access token EXPIRED
          ({{ state_attr('sensor.claude_usage_token_days_left', 'expires_at') }}).
          Nothing automatic renews it -- this house runs the static 1-year token.
          Re-mint: run scripts/mint_claude_token.py and copy the JSON to
          /config/claude_usage/credentials.json
          {%- else -%}
          The token itself is still valid ({{ d }} days left, expires
          {{ state_attr('sensor.claude_usage_token_days_left', 'expires_at') }}),
          so this is NOT a re-mint case -- check whether Anthropic is 429ing the
          usage endpoint, or whether the token was revoked early.
          {%- endif %}
  mode: single
- id: claude_usage_chain_expiry_warning
  alias: "Claude Usage - warn before the token expires"
  description: >-
    Nothing renews the access token -- this house runs the static 1-year token
    and the refresh chain is deliberately left to lapse, because refreshing is
    what downgrades a 1-year token to an 8h one. Only a human at a browser can
    re-mint, so the only useful thing an automation can do is say so while there
    is still time. Warns from 14 days out and clears itself after a re-mint.
    ALSO fires the moment looks_rotated goes true, which means something
    refreshed the chain and just cost eleven months.
  triggers:
    - trigger: time
      at: "09:00:00"
    - trigger: state
      entity_id: sensor.claude_usage_token_days_left
  conditions:
    - "{{ states('sensor.claude_usage_token_days_left') not in ['unknown', 'unavailable'] }}"
  actions:
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.claude_usage_token_days_left
                  below: 14
                - condition: template
                  value_template: "{{ state_attr('sensor.claude_usage_token_days_left', 'looks_rotated') | default(false) }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: claude_usage_chain_expiring
                title: >-
                  {% if state_attr('sensor.claude_usage_token_days_left', 'looks_rotated') %}
                  Claude usage token was ROTATED -- 1-year token lost
                  {%- else %}
                  Claude usage token: re-mint within {{ states('sensor.claude_usage_token_days_left') | float(0) | round(0) }} days
                  {%- endif %}
                message: >-
                  {% if state_attr('sensor.claude_usage_token_days_left', 'looks_rotated') -%}
                  Something refreshed the chain, so the 1-year token has been
                  revoked and replaced with an 8h one expiring
                  {{ state_attr('sensor.claude_usage_token_days_left', 'expires_at') }}.
                  Check that claude_usage_token_renew and claude_usage_token_retry
                  are still commented out in automations.yaml, then re-mint.
                  {%- else -%}
                  The access token expires
                  {{ state_attr('sensor.claude_usage_token_days_left', 'expires_at') }}
                  and nothing automatic renews it -- when it lapses the 2.9" panel
                  goes to a fault screen until it is re-minted by hand.
                  {%- endif %}
                  Run scripts/mint_claude_token.py and copy the JSON to
                  /config/claude_usage/credentials.json
      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: claude_usage_chain_expiring
  mode: single
