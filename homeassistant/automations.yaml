# DISABLED 2026-08-22 -- these two REVOKE the long-lived token, by design.
#
# The house runs the STATIC 1-YEAR token now, not the self-renewing chain.
# mint_claude_token.py asks for expires_in=31536000 and Anthropic grants it,
# with scope user:profile -- everything the usage endpoint needs. But a refresh
# revokes the current access token and hands back an 8h one, so leaving these
# enabled turns a 1-year token into an 8h token roughly four hours after every
# mint. That is exactly what happened at 20:07 BST today.
#
# Why the July decision flipped: NOTES-internal.md rejected the static plan
# because "the refresh token only lives ~30 days". True, but it only matters if
# you USE the chain. The access token's own life is independent of it. The 30-day
# wall was measured for the first time this morning, when it took the panel down.
#
# Trade: no self-heal. Accepted -- today's failure needed hands either way, and
# automation claude_usage_auth_failed_alert now catches any silent death within
# 45 min, which is the gap that let this run unnoticed for seven hours.
